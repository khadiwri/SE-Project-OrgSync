
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OrgSync Upcoming Events</title>
  <link rel="stylesheet" href="CSS/styles.css">
  <script src="JS/app.js" defer></script>
</head>
<body>
  <main class="app">
    <section class="panel">
      <h1>OrgSync</h1>
      <p class="subtitle">Upcoming campus events</p>

      <div class="student-meta">
        <strong id="student-name">Ava Martinez</strong>
        <span id="student-major">Computer Science</span>
      </div>

      <div class="button-row">
        <button id="view-events-button" type="button">Upcoming Events</button>
        <button id="empty-events-button" class="secondary" type="button">Show Empty State</button>
      </div>
    </section>

    <section class="panel">
      <h2>Sequence</h2>
      <ol id="sequence-log" aria-live="polite"></ol>
    </section>

    <section class="panel">
      <h2>Events</h2>
      <ul id="event-list"></ul>
    </section>
  </main>
</body>
</html>
